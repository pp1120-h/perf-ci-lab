name: Enterprise Performance Pipeline

'on':
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Java 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 4. 安装并启动 Flask 靶场
      run: |
        pip install flask
        python app.py &
        sleep 3

    - name: 5. 安装 JMeter
      run: |
        wget -q https://dlcdn.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.tgz
        tar -xzf apache-jmeter-5.6.2.tgz
        echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

    - name: 6. 执行 JMeter 压测
      run: |
        jmeter -n -t simple.jmx -l result.jtl

    - name: 7. 运行性能门禁 (拦截)
      run: |
        python perf_gate.py

    - name: 8. 归档 JTL 测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-results
        path: result.jtl
        overwrite: true